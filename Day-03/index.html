<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counter App - Day 03</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Counter App</h1>
    <div id="counter-value" class="counter">0</div>
    
    <div class="button-group">
      <button id="decrement-btn" class="btn btn-decrease">- Decrease</button>
      <button id="reset-btn" class="btn btn-reset">Reset</button>
      <button id="increment-btn" class="btn btn-increase">+ Increase</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
